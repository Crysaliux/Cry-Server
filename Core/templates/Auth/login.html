<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="icon" href="{{ url_for('static', path='Images/Icon.png') }}" type="image/png">
    </head>
    <body>
        <script>
            async function login() {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const response = await fetch('/auth/submit/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem("ATK", result.token);
                    window.location.href = result.redirect;
                } else {
                    const result = await response.json();
                    alert(result.detail);
                }
            }

            window.onload = function() {
            document.getElementById('login').onsubmit = function(event) {
                event.preventDefault();
                login();
                };
            };
        </script>
        <center>
            <form id="login" method="post">
                <label for="email">Email:  </label>
                <input type="email" id="email" name="email" maxlength="30" required>

                <label for="password">Password:  </label>
                <input type="password" id="password" name="password" maxlength="20" required>

                <input type="submit" value="Submit" class="subm">
            </form>
        </center>
    </body>
</html>
