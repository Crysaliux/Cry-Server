[coreserver] 
host=localhost
port=808

[rdsserver]
host=localhost
port=6379

[socket]
mode=asgi
logger=yes

[clientserver]
host=localhost
port=5173

[storage]
images=../Storage/Images
files=../Storage/Files

[clusters]
groups=%($)s
rooms=%(#)s

#ENCRYPTION: HS256

[oauth]
login_expiration=7 #days
session_expiration=15 #minutes

[batchloading]
members=30
messages=60

[limits]
message_length=1024 #characters
image_size=500 #pixels
file_size=10 #megabytes

[endpoints]
oauth=/oauth
gateway=/gateway
images=/images
files=/files