<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Chat with friends, have fun!">
        <meta name="keywords" content="chat online media">
        <meta name="author" content="Crysaliux">
        <title>UI test</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="container">
            <div id="sign-up-form">
                <div class="section_header">Welcome back!</div>
                <input type="email" placeholder="Your email" class="field" maxlength="35" id="email">
                <div id="password-section">
                    <input type="password" placeholder="Your password" maxlength="35" id="password">
                    <div id="show-password"></div>
                </div>
                <div id="login">Log in</div>
                <div id="forgot-password">Forgot your password?</div>
            </div>
        </div>
    </body>
</html>
